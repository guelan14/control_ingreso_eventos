# Postgres para desarrollo local: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos"]
      interval: 5s
      retries: 10

volumes:
  postgres-datos:
